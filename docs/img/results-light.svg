<svg xmlns="http://www.w3.org/2000/svg" width="900" height="688" viewBox="0 0 900 688" role="img" aria-labelledby="t d">
<title id="t">Context strategies, pruning and memory compared on 460 agent runs</title>
<desc id="d">Cost relative to a baseline and change in plan score, with 95% intervals: five ways of giving a coding agent project context (Claude Code, Haiku 4.5), and five cost levers in our own agent loop (Haiku 5.5).</desc>
<text x="24" y="34" fill="#0b0b0b" font-size="20" font-weight="600" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif">How should a coding agent get project context?</text>
<text x="24" y="58" fill="#52514e" font-size="13" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif">460 runs on one synthetic project · $31 API-equivalent (Claude Code) + $0.91 charged (own loop)</text>
<text x="24" y="121.0" fill="#52514e" font-size="12" font-weight="600" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif">CLAUDE CODE, HAIKU 4.5 · 300 RUNS · VS. THE AGENT EXPLORING ALONE</text>
<line x1="24" y1="129.0" x2="876" y2="129.0" stroke="#d9d8d4" stroke-width="1"/>
<text x="24" y="161.0" fill="#0b0b0b" font-size="14" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif">Whole project in the prompt</text>
<text x="24" y="203.0" fill="#0b0b0b" font-size="14" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif">Agent explores alone (baseline)</text>
<text x="24" y="245.0" fill="#0b0b0b" font-size="14" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif">Context service, offered</text>
<text x="24" y="287.0" fill="#0b0b0b" font-size="14" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif">Context service, used first</text>
<text x="24" y="329.0" fill="#0b0b0b" font-size="14" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif">Oracle: exactly the needed pieces</text>
<text x="24" y="371.0" fill="#52514e" font-size="12" font-weight="600" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif">OWN AGENT LOOP, HAIKU 5.5 · 160 RUNS · VS. THE SAME LOOP WITHOUT IT</text>
<line x1="24" y1="379.0" x2="876" y2="379.0" stroke="#d9d8d4" stroke-width="1"/>
<text x="24" y="411.0" fill="#0b0b0b" font-size="14" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif">Low effort, less thinking (10 pairs)</text>
<text x="24" y="453.0" fill="#0b0b0b" font-size="14" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif">Trusted, reviewed memory (20 pairs)</text>
