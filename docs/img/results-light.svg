<svg xmlns="http://www.w3.org/2000/svg" width="900" height="374" viewBox="0 0 900 374" role="img" aria-labelledby="t d">
<title id="t">How to make a coding agent cheaper</title>
<desc id="d">Change in cost vs. a plain agent that reads the files itself: one bar per setup with a verdict on plan quality.</desc>
<text x="24" y="38" fill="#0b0b0b" font-size="22" font-weight="600" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif">How to make a coding agent cheaper</text>
<text x="24" y="64" fill="#52514e" font-size="14" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif">Change in cost vs. a plain agent that reads the files itself · 565 graded runs</text>
<text x="330.0" y="96" fill="#52514e" font-size="12" text-anchor="middle" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif">−50%</text>
<text x="430.0" y="96" fill="#52514e" font-size="12" text-anchor="middle" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif">0</text>
<text x="530.0" y="96" fill="#52514e" font-size="12" text-anchor="middle" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif">+50%</text>
<text x="630.0" y="96" fill="#52514e" font-size="12" text-anchor="middle" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif">+100%</text>
<text x="24" y="129.0" fill="#0b0b0b" font-size="15" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif">Ask a context service first</text>
<rect x="357.8" y="115.0" width="72.2" height="18" rx="3" fill="#2a78d6"/>
<text x="349.8" y="129.0" fill="#0b0b0b" font-size="14" font-weight="600" text-anchor="end" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif">−36%</text>
<text x="700" y="129.0" fill="#0b0b0b" font-size="14" font-weight="600" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif">same quality</text>
<text x="24" y="169.0" fill="#0b0b0b" font-size="15" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif">... and think less</text>
<rect x="330.0" y="155.0" width="100.0" height="18" rx="3" fill="#b9b8b3"/>
<text x="322.0" y="169.0" fill="#0b0b0b" font-size="14" font-weight="600" text-anchor="end" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif">−62%</text>
<text x="700" y="169.0" fill="#52514e" font-size="14" font-weight="400" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif">slightly lower quality</text>
<text x="24" y="209.0" fill="#0b0b0b" font-size="15" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif">... and also trust reviewed memory</text>
<rect x="330.0" y="195.0" width="100.0" height="18" rx="3" fill="#b9b8b3"/>
<text x="322.0" y="209.0" fill="#0b0b0b" font-size="14" font-weight="600" text-anchor="end" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif">−72%</text>
<text x="700" y="209.0" fill="#52514e" font-size="14" font-weight="400" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif">lower quality</text>
<text x="24" y="249.0" fill="#0b0b0b" font-size="15" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif">Prune old context as it works</text>
<rect x="430.0" y="235.0" width="33.6" height="18" rx="3" fill="#b9b8b3"/>
<text x="471.6" y="249.0" fill="#0b0b0b" font-size="14" font-weight="600" text-anchor="start" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif">+17%</text>
<text x="700" y="249.0" fill="#52514e" font-size="14" font-weight="400" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif">no saving</text>
<text x="24" y="289.0" fill="#0b0b0b" font-size="15" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif">Put the whole project in the prompt</text>
<rect x="430.0" y="275.0" width="193.1" height="18" rx="3" fill="#b9b8b3"/>
<text x="631.1" y="289.0" fill="#0b0b0b" font-size="14" font-weight="600" text-anchor="start" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif">+97%</text>
<text x="700" y="289.0" fill="#52514e" font-size="14" font-weight="400" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif">costs double</text>
<line x1="430.0" y1="104" x2="430.0" y2="304" stroke="#52514e" stroke-width="1.5"/>
<text x="24" y="334" fill="#52514e" font-size="12" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif">Left of the line = cheaper. Highlighted = cheaper with the same plan quality (95% intervals, plans graded by fixed rubrics).</text>
<text x="24" y="352" fill="#52514e" font-size="12" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif">Our own agent loop on one project; the whole-project row is from a separate 300-run study. All results: docs/findings.md</text>
</svg>
