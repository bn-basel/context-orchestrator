<svg xmlns="http://www.w3.org/2000/svg" width="900" height="562" viewBox="0 0 900 562" role="img" aria-labelledby="t d">
<title id="t">Context strategies, pruning and memory compared on 370 agent runs</title>
<desc id="d">Cost relative to a baseline and change in plan score, with 95% intervals: five ways of giving a coding agent project context (Claude Code, Haiku 4.5), and pruning and cross-task memory in our own agent loop (Haiku 5.5).</desc>
<text x="24" y="34" fill="#ffffff" font-size="20" font-weight="600" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif">How should a coding agent get project context?</text>
<text x="24" y="58" fill="#c3c2b7" font-size="13" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif">370 runs on one synthetic project · $31 API-equivalent (Claude Code) + $0.43 charged (own loop)</text>
<text x="24" y="121.0" fill="#c3c2b7" font-size="12" font-weight="600" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif">CLAUDE CODE, HAIKU 4.5 · 300 RUNS · VS. THE AGENT EXPLORING ALONE</text>
<line x1="24" y1="129.0" x2="876" y2="129.0" stroke="#3a3a37" stroke-width="1"/>
<text x="24" y="161.0" fill="#ffffff" font-size="14" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif">Whole project in the prompt</text>
<text x="24" y="203.0" fill="#ffffff" font-size="14" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif">Agent explores alone (baseline)</text>
<text x="24" y="245.0" fill="#ffffff" font-size="14" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif">Context service, offered</text>
<text x="24" y="287.0" fill="#ffffff" font-size="14" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif">Context service, used first</text>
<text x="24" y="329.0" fill="#ffffff" font-size="14" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif">Oracle: exactly the needed pieces</text>
<text x="24" y="371.0" fill="#c3c2b7" font-size="12" font-weight="600" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif">OWN AGENT LOOP, HAIKU 5.5 · 70 RUNS · VS. THE SAME LOOP WITHOUT IT</text>
