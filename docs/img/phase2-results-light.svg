<svg xmlns="http://www.w3.org/2000/svg" width="900" height="420" viewBox="0 0 900 420" role="img" aria-labelledby="t d">
<title id="t">Context strategies compared on 300 Claude Code runs</title>
<desc id="d">Cost relative to an agent exploring alone, and change in plan score, for five ways of giving a coding agent project context, with 95% intervals.</desc>
<text x="24" y="34" fill="#0b0b0b" font-size="20" font-weight="600" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif">How should a coding agent get project context?</text>
<text x="24" y="58" fill="#52514e" font-size="13" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif">300 Claude Code runs (Haiku 4.5) · 20 tasks × 5 strategies × 3 · $31 API-equivalent in total</text>
