<text x="24" y="392" fill="#52514e" font-size="12" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif">Dots: per-task paired estimates; lines: 95% bootstrap intervals over tasks. Cost is Claude Code's API list-price estimate, not a subscription charge.</text>
