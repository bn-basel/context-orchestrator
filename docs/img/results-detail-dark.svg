<svg xmlns="http://www.w3.org/2000/svg" width="900" height="792" viewBox="0 0 900 792" role="img" aria-labelledby="t d">
<title id="t">What actually cut a coding agent’s cost? (all results)</title>
<desc id="d">Change in cost vs. the same agent without the idea: one bar per setup with a verdict on plan quality.</desc>
<text x="24" y="38" fill="#ffffff" font-size="22" font-weight="600" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif">What actually cut a coding agent’s cost? (all results)</text>
<text x="24" y="64" fill="#c3c2b7" font-size="14" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif">Change in cost vs. the same agent without the idea · 565 graded runs</text>
<text x="330.0" y="96" fill="#c3c2b7" font-size="12" text-anchor="middle" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif">−50%</text>
<text x="430.0" y="96" fill="#c3c2b7" font-size="12" text-anchor="middle" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif">0</text>
<text x="530.0" y="96" fill="#c3c2b7" font-size="12" text-anchor="middle" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif">+50%</text>
<text x="630.0" y="96" fill="#c3c2b7" font-size="12" text-anchor="middle" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif">+100%</text>
<text x="24" y="136.0" fill="#c3c2b7" font-size="12" font-weight="600" letter-spacing="0.5" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif">GIVING THE AGENT PROJECT CONTEXT</text>
<text x="24" y="175.0" fill="#ffffff" font-size="15" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif">Ask a context service first</text>
<rect x="387.5" y="161.0" width="42.5" height="18" rx="3" fill="#3987e5"/>
<text x="379.5" y="175.0" fill="#ffffff" font-size="14" font-weight="600" text-anchor="end" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif">−21%</text>
<text x="700" y="175.0" fill="#ffffff" font-size="14" font-weight="600" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif">works, same quality</text>
<text x="24" y="215.0" fill="#ffffff" font-size="15" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif">Offer the service (agent may skip it)</text>
<rect x="416.0" y="201.0" width="14.0" height="18" rx="3" fill="#5f5e5a"/>
<text x="408.0" y="215.0" fill="#ffffff" font-size="14" font-weight="600" text-anchor="end" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif">−7%</text>
<text x="700" y="215.0" fill="#c3c2b7" font-size="14" font-weight="400" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif">no clear saving</text>
<text x="24" y="255.0" fill="#ffffff" font-size="15" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif">Put the whole project in the prompt</text>
<rect x="430.0" y="241.0" width="193.1" height="18" rx="3" fill="#5f5e5a"/>
<text x="631.1" y="255.0" fill="#ffffff" font-size="14" font-weight="600" text-anchor="start" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif">+97%</text>
<text x="700" y="255.0" fill="#c3c2b7" font-size="14" font-weight="400" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif">costs more</text>
<text x="24" y="295.0" fill="#ffffff" font-size="15" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif">Hand over exactly the right pieces</text>
<rect x="343.2" y="281.0" width="86.8" height="18" rx="3" fill="#5f5e5a"/>
<text x="335.2" y="295.0" fill="#ffffff" font-size="14" font-weight="600" text-anchor="end" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif">−43%</text>
<text x="700" y="295.0" fill="#c3c2b7" font-size="14" font-weight="400" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif">best case, not buildable</text>
<text x="24" y="342.0" fill="#c3c2b7" font-size="12" font-weight="600" letter-spacing="0.5" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif">CHANGING HOW THE AGENT WORKS</text>
<text x="24" y="381.0" fill="#ffffff" font-size="15" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif">Think less (low effort setting)</text>
<rect x="371.8" y="367.0" width="58.2" height="18" rx="3" fill="#3987e5"/>
<text x="363.8" y="381.0" fill="#ffffff" font-size="14" font-weight="600" text-anchor="end" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif">−29%</text>
<text x="700" y="381.0" fill="#ffffff" font-size="14" font-weight="600" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif">works, same quality</text>
<text x="24" y="421.0" fill="#ffffff" font-size="15" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif">Memory of earlier tasks, reviewed</text>
<rect x="394.4" y="407.0" width="35.6" height="18" rx="3" fill="#3987e5"/>
<text x="386.4" y="421.0" fill="#ffffff" font-size="14" font-weight="600" text-anchor="end" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif">−18%</text>
<text x="700" y="421.0" fill="#ffffff" font-size="14" font-weight="600" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif">works, slightly less thorough</text>
<text x="24" y="461.0" fill="#ffffff" font-size="15" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif">Show long files as an outline first</text>
<rect x="412.8" y="447.0" width="17.2" height="18" rx="3" fill="#5f5e5a"/>
<text x="404.8" y="461.0" fill="#ffffff" font-size="14" font-weight="600" text-anchor="end" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif">−9%</text>
<text x="700" y="461.0" fill="#c3c2b7" font-size="14" font-weight="400" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif">inconclusive</text>
<text x="24" y="501.0" fill="#ffffff" font-size="15" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif">Memory of earlier tasks, unreviewed</text>
<rect x="426.9" y="487.0" width="3.1" height="18" rx="3" fill="#5f5e5a"/>
<text x="418.9" y="501.0" fill="#ffffff" font-size="14" font-weight="600" text-anchor="end" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif">−2%</text>
<text x="700" y="501.0" fill="#c3c2b7" font-size="14" font-weight="400" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif">no clear saving</text>
<text x="24" y="541.0" fill="#ffffff" font-size="15" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif">Prune old context as it works</text>
<rect x="430.0" y="527.0" width="33.6" height="18" rx="3" fill="#5f5e5a"/>
<text x="471.6" y="541.0" fill="#ffffff" font-size="14" font-weight="600" text-anchor="start" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif">+17%</text>
<text x="700" y="541.0" fill="#c3c2b7" font-size="14" font-weight="400" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif">no saving, likely costs more</text>
<text x="24" y="588.0" fill="#c3c2b7" font-size="12" font-weight="600" letter-spacing="0.5" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif">COMBINED, AGAINST A PLAIN AGENT</text>
<text x="24" y="627.0" fill="#ffffff" font-size="15" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif">Ask the service first</text>
<rect x="357.8" y="613.0" width="72.2" height="18" rx="3" fill="#3987e5"/>
<text x="349.8" y="627.0" fill="#ffffff" font-size="14" font-weight="600" text-anchor="end" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif">−36%</text>
<text x="700" y="627.0" fill="#ffffff" font-size="14" font-weight="600" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif">works, same quality</text>
<text x="24" y="667.0" fill="#ffffff" font-size="15" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif">... and think less</text>
<rect x="330.0" y="653.0" width="100.0" height="18" rx="3" fill="#5f5e5a"/>
<text x="322.0" y="667.0" fill="#ffffff" font-size="14" font-weight="600" text-anchor="end" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif">−62%</text>
<text x="700" y="667.0" fill="#c3c2b7" font-size="14" font-weight="400" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif">quality just under the bar</text>
<text x="24" y="707.0" fill="#ffffff" font-size="15" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif">... and think less and trust memory</text>
<rect x="330.0" y="693.0" width="100.0" height="18" rx="3" fill="#5f5e5a"/>
<text x="322.0" y="707.0" fill="#ffffff" font-size="14" font-weight="600" text-anchor="end" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif">−72%</text>
<text x="700" y="707.0" fill="#c3c2b7" font-size="14" font-weight="400" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif">cheaper, but lower quality</text>
<line x1="430.0" y1="104" x2="430.0" y2="722" stroke="#c3c2b7" stroke-width="1.5"/>
<text x="24" y="752" fill="#c3c2b7" font-size="12" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif">Left of the line = cheaper. Highlighted = the saving is clear (95% interval) and plan quality held. Each group has its own baseline.</text>
<text x="24" y="770" fill="#c3c2b7" font-size="12" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif">First group: an existing coding agent, 300 runs. Other groups: our own agent loop on a newer model.</text>
</svg>
