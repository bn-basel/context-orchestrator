[project]
name = "context-orchestrator"
version = "0.1.0"
description = "An experimental context service that gives AI agents compact, source-referenced project context on demand."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
authors = [{ name = "bn-basel" }]
keywords = ["ai-agents", "context", "retrieval", "llm", "evaluation"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development",
]
# The core is deliberately standard-library only (sqlite3 with FTS5).
dependencies = []

[project.scripts]
ctxo = "context_orchestrator.agent_interface.cli:main"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/context_orchestrator"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["examples/sample_project", "benchmarks/corpora"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]
ignore = ["SIM905"]  # word lists written as "a b c".split() read better
